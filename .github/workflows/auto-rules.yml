# 深巷有喵的「Surge」上游同步规则
# 版本：2.1.0
# 日期：2026.05.02
# 作者：https://github.com/Rabbit-Spec/Surge

name: Auto-Surge-Rules

on:
  schedule:
    # 北京时间每天 04:00 执行
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Sub-Store Node Rename
        shell: bash
        run: node ./scripts/test-substore-node-rename.js

      - name: Test Rule Scripts
        shell: pwsh
        run: ./scripts/test-rules.ps1

      - name: Check Rule Sources
        shell: pwsh
        run: ./scripts/check-rule-sources.ps1

      - name: Generate Rules
        shell: pwsh
        run: ./scripts/update-rules.ps1

      - name: Validate Rules
        shell: pwsh
        run: ./scripts/validate-rules.ps1 -StrictDuplicates

      - name: Report Rule Changes
        shell: pwsh
        run: ./scripts/report-rule-changes.ps1 -FailOnHighRisk

      - name: Commit and Push Changes
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Rules/
          if ! git diff --staged --quiet; then
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
            git commit -m "$COMMIT_TIME Update rules"
            git push
          fi
